name: Developer release

on:
  push:
    branches:
      - Developer-Test

permissions: {}

jobs:
  release:
    if: github.repository == 'v-vadim/ha-syncleo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set the test version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/syncleo/manifest.json")
          manifest = json.loads(path.read_text())
          major, minor, patch = map(int, manifest["version"].split("."))
          short_sha = os.environ["GITHUB_SHA"][:7]
          version = f"{major}.{minor}.{patch + 1}-beta.{os.environ['GITHUB_RUN_NUMBER']}+{short_sha}"
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
              output.write(f"short_sha={short_sha}\n")
          PY
      - name: Publish the preliminary release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom_components/syncleo/manifest.json
          git commit -m "Prepare test release ${VERSION}"
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"
          gh release create "${VERSION}" \
            --title "${SHORT_SHA}" \
            --notes "Developer-Test commit: ${GITHUB_SHA}" \
            --prerelease \
            --latest=false
